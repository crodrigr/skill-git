spec_version: "1.0"

course:
  id: "curso-git"
  title: "GitHub y Control de Versiones"
  description: "Curso de control de versiones con Git y GitHub: repositorios, commits, ramas, trabajo remoto con push y pull, resolución de conflictos y archivos ignorados."

  category: "DEVOPS"
  level: "BASIC"
  language: "es"
  version: "1.0.0"

  author: "Docente"

  tags:
    - git
    - github
    - control-de-versiones

settings:
  allow_student_downloads: true
  track_progress: true

repository:
  structure: "CONVENTIONAL"
  module_pattern: "^[0-9]{2}-"
  module_sort: "NAME"
